<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="/Styles/HomePage.css">
    <script defer src="/Scripts/popup.js"></script>
</head>

<body>
    
    <section id="colossos">
        <h2>Colossus</h2>

        <div class="cards-container">

            <!-- Colosso 1 -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/ValusTemplate.webp" class="card-img-top" alt="Colosso 1">
                <div class="card-body">
                    <p class="open-modal" data-title="Valus" data-desc="Erga tua espada sob a luz...e siga para a direção onde a luz da espada se une...
                   Lá, tu deverás encontrar o colosso que tu deves derrotar." data-link="Colosso1.html">
                        Valus
                    </p>
                </div>
            </div>

            <!-- Colosso 2  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/QuadratusTemplate.webp" class="card-img-top" alt="Colosso 2">
                <div class="card-body">
                    <p class="open-modal" data-title="Quadratus"
                        data-desc="Teu próximo alvo é... Na caverna à beira-mar... Se move lentamente... Erga tua coragem para derrotá-lo."
                        data-link="Colosso2.html">
                        Quadratus
                    </p>
                </div>
            </div>

             <!-- Colosso 3  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/GaiusTemplate.webp" class="card-img-top" alt="Colosso 3">
                <div class="card-body">
                    <p class="open-modal" data-title="Gaius"
                        data-desc="Teu próximo alvo é... Um dossel gigante se eleva aos céus... A ira do gigante adormecido despedaça a terra..."
                        data-link="Colosso3.html">
                        Gaius
                    </p>
                </div>
            </div>

             <!-- Colosso 4  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/PhaedraTemplate.webp" class="card-img-top" alt="Colosso 4">
                <div class="card-body">
                    <p class="open-modal" data-title="Phaedra"
                        data-desc="Teu próximo alvo é... Na terra dos vastos campos verdes... Fileiras de sepulturas norteadoras... É gigante sim, mas temível, não é."
                        data-link="Colosso4.html">
                        Phaedra
                    </p>
                </div>
            </div>

             <!-- Colosso 5  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/AvionTemplate.webp" class="card-img-top" alt="Colosso 5">
                <div class="card-body">
                    <p class="open-modal" data-title="Avion"
                        data-desc="Teu próximo alvo é... Ele lança uma sombra colossal sobre um lago enevoado enquanto plana pelos céus... Alcançá-lo não é tarefa fácil..."
                        data-link="Colosso5.html">
                        Avion
                    </p>
                </div>
            </div>

             <!-- Colosso 6  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/BarbaTemplate.webp" class="card-img-top" alt="Colosso 6">
                <div class="card-body">
                    <p class="open-modal" data-title="Barba"
                        data-desc="Teu próximo alvo é... Um gigante espreita por debaixo do templo... Ele anseia por destruição... Mas um tolo, ele não é."
                        data-link="Colosso6.html">
                        Barba
                    </p>
                </div>
            </div>

             <!-- Colosso 7  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/HydrusTemplate.webp" class="card-img-top" alt="Colosso 7">
                <div class="card-body">
                    <p class="open-modal" data-title="Hydrus"
                        data-desc="Teu próximo alvo é... Uma ruína escondida no lago... Uma onda de trovão espreita debaixo da água..."
                        data-link="Colosso7.html">
                        Hydrus
                    </p>
                </div>
            </div>

             <!-- Colosso 8  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/KuromoriTemplate.webp" class="card-img-top" alt="Colosso 8">
                <div class="card-body">
                    <p class="open-modal" data-title="Kuromori"
                        data-desc="Teu próximo alvo é... Uma cauda presa em um balde floresta adentro... Uma sombra que rasteja nas paredes..."
                        data-link="Colosso8.html">
                        Kuromori
                    </p>
                </div>
            </div>

             <!-- Colosso 9  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/BasaranTemplate.webp" class="card-img-top" alt="Colosso 9">
                <div class="card-body">
                    <p class="open-modal" data-title="Kuromori"
                        data-desc="Teu próximo alvo é... A terra onde as árvores quase não crescem... Ele dorme no leito de um lago seco... Um despertar violento."
                        data-link="Colosso9.html">
                        Basaran
                    </p>
                </div>
            </div>

             <!-- Colosso 10  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/DirgeTemplate.webp" class="card-img-top" alt="Colosso 10">
                <div class="card-body">
                    <p class="open-modal" data-title="Dirge"
                        data-desc="Teu próximo alvo é... Uma duna de areia isolada... Seus rastros estão bem escondidos... Sacudindo a terra, seu olhar está sobre ti..."
                        data-link="Colosso10.html">
                        Dirge
                    </p>
                </div>
            </div>

             <!-- Colosso 11  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/CelosiaTemplate.webp" class="card-img-top" alt="Colosso 11">
                <div class="card-body">
                    <p class="open-modal" data-title="Celosia"
                        data-desc="Teu próximo alvo é... Um altar acima do lago... Um guardião solto... Ele mantém as chamas vivas."
                        data-link="Colosso11.html">
                        Celosia
                    </p>
                </div>
            </div>

             <!-- Colosso 12  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/PelagiaTemplate.webp" class="card-img-top" alt="Colosso 12">
                <div class="card-body">
                    <p class="open-modal" data-title="Pelagia"
                        data-desc="Teu próximo alvo é... O paraíso flutua sobre o lago... Um ser silencioso empunha o trovão... Uma ponte móvel para ir para um terreno mais elevado."
                        data-link="Colosso12.html">
                        Pelagia
                    </p>
                </div>
            </div>

             <!-- Colosso 13  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/PhalanxTemplate.webp" class="card-img-top" alt="Colosso 13">
                <div class="card-body">
                    <p class="open-modal" data-title="Phalanx"
                        data-desc="Teu próximo alvo é... As vastas terras desérticas... Uma trilha gigante flutua pelo céu... Tu não está a sós..."
                        data-link="Colosso13.html">
                        Phalanx
                    </p>
                </div>
            </div>

             <!-- Colosso 14  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/CenobiaTemplate.webp" class="card-img-top" alt="Colosso 14">
                <div class="card-body">
                    <p class="open-modal" data-title="Phalanx"
                        data-desc="Teu próximo alvo é... Um guardião solto... Uma cidade fechada além do canal... Ele anseia por destruição..."
                        data-link="Colosso14.html">
                        Cenobia
                    </p>
                </div>
            </div>

             <!-- Colosso 15  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/ArgusTemplate.webp" class="card-img-top" alt="Colosso 15">
                <div class="card-body">
                    <p class="open-modal" data-title="Argus"
                        data-desc="Teu próximo alvo é... Um gigante caiu no vale... Ele age como uma sentinela para a cidade destruída..."
                        data-link="Colosso15.html">
                        Argus
                    </p>
                </div>
            </div>

             <!-- Colosso 16  -->
            <div class="card" style="width: 18rem;">
                <img src="/Images/Colossos/MalusTemplate.webp" class="card-img-top" alt="Colosso 16">
                <div class="card-body">
                    <p class="open-modal" data-title="Malus"
                        data-desc="Finalmente, o último colosso... O ritual está quase acabado... Teu desejo está quase garantido... Mas alguém agora levanta-se para entrar em teu caminho... Apressa-te, pois o tempo é curto..."
                        data-link="Colosso16.html">
                        Malus
                    </p>
                </div>
            </div>

        </div>
    </section>

    <div id="modal-bg" class="modal-bg">
        <div class="modal">
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <a id="modal-link" class="open-link" target="_blank">Abrir página completa</a>
            <div class="close-btn" id="close-modal">Fechar</div>
        </div>
    </div>


<audio id="popupSound" src="/Sounds/popup.wav" preload="auto"></audio>
</body>

</html>
