<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/mapa.css">
    <script defer src="/Scripts/mapa.js"></script>
    <title>Mapa Interativo</title>
</head>
<body>
    <section id="mapa-colossos">
    <h2>Mapa Interativo</h2>

    <div id="map">
        <!-- Ponto do Colosso 1 -->
        <div class="marker" style="top: 40%; left: 30%;" data-name="Valus" data-id="1"></div>

        <!-- Ponto do Colosso 2 -->
        <div class="marker" style="top: 55%; left: 25%;" data-name="Quadratus" data-id="2"></div>

        <!-- Ponto do Colosso 3 -->
        <div class="marker" style="top: 35%; left: 60%;" data-name="Gaius" data-id="3"></div>

        <!-- Ponto do Colosso 4 -->
        <div class="marker" style="top: 70%; left: 50%;" data-name="Phaedra" data-id="4"></div>
    </div>

    <!-- Popup do marcador -->
    <div id="popup">
        <h3 id="popup-title"></h3>
        <button id="close-popup">Fechar</button>
    </div>
</section>

</div>







</body>
</html>
